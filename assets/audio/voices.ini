; Original RA2/YR Conscript voice sets extracted from the local 1.001 corpus.
; The source event names are ConscriptSelect, ConscriptMove and
; ConscriptAttackCommand in sound.ini. Samples are stored as PCM WAV so the
; SDL runtime can decode the original Westwood IMA ADPCM recordings reliably.

[E2Select]
Files=e2_select_1.wav,e2_select_2.wav,e2_select_3.wav
NoImmediateRepeat=yes

[E2Move]
Files=e2_move_1.wav,e2_move_2.wav,e2_move_3.wav
NoImmediateRepeat=yes

[E2Attack]
Files=e2_attack_1.wav,e2_attack_2.wav,e2_attack_3.wav
NoImmediateRepeat=yes
